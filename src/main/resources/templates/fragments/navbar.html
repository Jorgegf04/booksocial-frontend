<!--/*
  ============================================================
  Fragmento: Barra de navegación global
  Ruta: Se incluye en todas las páginas públicas y privadas
  Controlador: — (fragmento, sin controlador propio)
  Uso: <div th:replace="~{fragments/navbar :: navbar}"></div>

  Recibe de la SESIÓN HTTP (no del modelo del controlador):
    - session.userId   : Long              → null si no hay sesión activa
    - session.username : String            → nombre de usuario autenticado
    - session.cart     : List<CartItemDTO> → ítems del carrito en sesión

  Fragmentos incluidos: ninguno (es un fragmento raíz)

  Nota: incluye un bloque <script> al final para sincronizar
  el carrito entre la sesión de servidor y localStorage.
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  th:fragment="navbar" declara que este <nav> se puede insertar
  en otras plantillas con th:replace="~{fragments/navbar :: navbar}".
  fixed-top: Bootstrap fija la barra en la parte superior al hacer scroll.
  nav-glass: clase custom de main.css que aplica el efecto blur/cristal.
-->
<nav th:fragment="navbar"
     class="navbar navbar-expand-lg fixed-top nav-glass py-3">
  <div class="container">

    <!-- Logo / nombre del sitio -->
    <a class="navbar-brand" href="/">BookSocial</a>

    <!--
      navbar-toggler: botón hamburguesa visible solo en móvil (< lg).
      data-bs-toggle/target: Bootstrap conecta el botón con el div#mainNav.
      border-0: elimina el borde por defecto del botón.
    -->
    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!--
      collapse navbar-collapse: oculto en móvil, visible en escritorio.
      me-auto: empuja el resto de elementos a la derecha (Bootstrap margin-end auto).
      ms-4 gap-1: margen inicial y separación entre ítems.
    -->
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto ms-4 gap-1">
        <li class="nav-item">
          <a class="nav-link" href="/catalog">
            Catálogo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/events">Eventos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/community">Comunidad</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/authors">Autores</a>
        </li>
      </ul>

      <!-- Buscador integrado: envía GET /catalog/filter?title=...&page=0 -->
      <form class="d-flex me-3 navbar-search-form" action="/catalog/filter" method="get">
        <input type="hidden" name="page" value="0">
        <!--
          input-group: componente Bootstrap que une visualmente un input con un botón.
          navbar-search-group: fija el ancho del buscador (definido en main.css).
        -->
        <div class="input-group navbar-search-group">
          <!--
            form-control form-control-sm: input estilizado por Bootstrap, versión pequeña.
            navbar-search-input: redondea el lado izquierdo para acoplar con el botón.
          -->
          <input class="form-control form-control-sm navbar-search-input"
                 type="search" name="title" placeholder="Buscar obras..."
                 autocomplete="off">
          <!--
            btn btn-sm: botón Bootstrap pequeño.
            navbar-search-btn: aplica el color de marca y redondea el lado derecho.
          -->
          <button class="btn btn-sm navbar-search-btn"
                  type="submit"
                  aria-label="Buscar">
            <span class="material-symbols-outlined">search</span>
          </button>
        </div>
      </form>

      <!-- Icono de carrito con badge que muestra la cantidad de ítems distintos -->
      <!--
        position-relative: necesario para que el .cart-badge (absolute) se posicione
        respecto a este enlace, no a otro ancestro.
        th:if: Thymeleaf — renderiza el badge solo si el carrito tiene ítems.
        #lists.size(): función utilitaria de Thymeleaf para obtener el tamaño de una lista.
      -->
      <a href="/cart" class="position-relative text-decoration-none navbar-cart-link">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span th:if="${session.cart != null and !session.cart.isEmpty()}"
              class="cart-badge"
              th:text="${#lists.size(session.cart)}"></span>
      </a>

      <!-- Zona de autenticación: cambia según si hay sesión activa o no -->
      <div class="d-flex align-items-center gap-2">

        <!--
          th:block: contenedor Thymeleaf que no genera HTML extra.
          th:if: muestra este bloque cuando session.userId es null (no autenticado).
        -->
        <th:block th:if="${session.userId == null}">
          <!-- Botón de inicio de sesión (solo texto, sin fondo) -->
          <a href="/auth/login" class="btn btn-sm navbar-btn-login">
            Iniciar sesión
          </a>
          <!-- Botón de registro con fondo de marca -->
          <a href="/auth/register" class="btn btn-sm rounded-pill px-3 navbar-btn-register">
            Registrarse
          </a>
        </th:block>

        <!-- Bloque visible cuando hay sesión activa (usuario autenticado) -->
        <th:block th:if="${session.userId != null}">
          <!--
            th:href="@{...}": genera la URL de forma segura con el contexto de la app.
            th:text: reemplaza el contenido del <span> con el valor de session.username.
          -->
          <a th:href="@{/user/me}"
             class="d-flex align-items-center gap-2 text-decoration-none navbar-user-link">
            <span class="material-symbols-outlined">account_circle</span>
            <span th:text="${session.username}">usuario</span>
          </a>
          <!-- Botón de cierre de sesión con borde de marca -->
          <a href="/auth/logout" class="btn btn-sm rounded-pill px-3 navbar-btn-logout">
            Cerrar sesión
          </a>
        </th:block>

      </div>
    </div>

  </div>
</nav>

<!--
  PERSISTENCIA DEL CARRITO EN localStorage
  ─────────────────────────────────────────
  Lógica en 3 casos según el estado de session.cart (inlinado por Thymeleaf):

  1. session.cart == null   → sesión expirada o nueva.
     Si localStorage tiene ítems guardados Y no se ha intentado ya en esta pestaña
     (flag sessionStorage 'bs_cart_synced'), llama a POST /cart/sync y recarga.

  2. session.cart no vacío  → guardar snapshot mínimo {productId, quantity} en localStorage.

  3. session.cart vacío []  → carrito vaciado intencionalmente (checkout o eliminar todos).
     Limpia localStorage para evitar que se vuelva a restaurar.
-->
<script th:inline="javascript">
  /*<![CDATA[*/
  (function () {
    var sessionCart = /*[[${session.cart}]]*/ null;

    if (sessionCart === null) {
      // Caso 1: sesión sin carrito — intentar restaurar desde localStorage
      if (!sessionStorage.getItem('bs_cart_synced')) {
        var saved = localStorage.getItem('bs_cart');
        if (saved) {
          try {
            var items = JSON.parse(saved);
            if (items && items.length > 0) {
              sessionStorage.setItem('bs_cart_synced', '1');
              fetch('/cart/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: saved
              }).then(function (r) {
                if (r.ok) window.location.reload();
                else localStorage.removeItem('bs_cart');
              }).catch(function () {});
            }
          } catch (e) {
            localStorage.removeItem('bs_cart');
          }
        }
      }

    } else if (sessionCart.length > 0) {
      // Caso 2: carrito activo — guardar snapshot en localStorage
      var snapshot = sessionCart.map(function (item) {
        return { productId: item.productId, quantity: item.quantity };
      });
      localStorage.setItem('bs_cart', JSON.stringify(snapshot));
      sessionStorage.removeItem('bs_cart_synced');

    } else {
      // Caso 3: carrito vaciado explícitamente — limpiar localStorage
      localStorage.removeItem('bs_cart');
      sessionStorage.removeItem('bs_cart_synced');
    }
  })();
  /*]]>*/
</script>

</body>
</html>
