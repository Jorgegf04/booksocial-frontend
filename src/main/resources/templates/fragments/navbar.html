<!--
  Fragmento: Barra de navegación global
  Uso: th:replace="~{fragments/navbar :: navbar}" en todas las páginas.

  Comportamiento según estado de sesión (leído directamente de la sesión HTTP):
  - session.userId == null  → se muestran los botones "Iniciar sesión" y "Registrarse".
  - session.userId != null  → se muestra el nombre de usuario (session.username) con
                              enlace a /user/me y el botón "Cerrar sesión" (/auth/logout).

  Badge del carrito:
  - session.cart es la List<CartItemDTO> almacenada en sesión por CartService.
  - Si no está vacío se muestra un badge rojo con el número de ítems distintos.

  Búsqueda integrada:
  - El campo "title" envía GET /catalog/filter con page=0 y title como parámetro,
    reutilizando el mismo controlador de filtrado del catálogo.

  Navegación:
  - /catalog   → Catálogo de obras con filtros
  - /events    → Página de eventos con join/leave
  - /community → Página de comunidad con todos los usuarios y follow/unfollow
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg fixed-top nav-glass py-3">
  <div class="container">

    <a class="navbar-brand" href="/">BookSocial</a>

    <button class="navbar-toggler border-0" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto ms-4 gap-1">
        <li class="nav-item">
          <a class="nav-link" href="/catalog">
            Catálogo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/events">Eventos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/community">Comunidad</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/authors">Autores</a>
        </li>
      </ul>

      <!-- Search -->
      <form class="d-flex me-3" action="/catalog/filter" method="get" style="position:relative;">
        <input type="hidden" name="page" value="0">
        <div class="input-group" style="width:240px;">
          <input class="form-control form-control-sm"
                 style="border-radius:2rem 0 0 2rem; padding-right:0.5rem;"
                 type="search" name="title" placeholder="Buscar obras..."
                 autocomplete="off">
          <button class="btn btn-sm"
                  type="submit"
                  style="border-radius:0 2rem 2rem 0; background-color:var(--bs-primary); color:#fff; border:none; padding:0 0.75rem;"
                  aria-label="Buscar">
            <span class="material-symbols-outlined" style="font-size:1rem; vertical-align:middle;">search</span>
          </button>
        </div>
      </form>

      <!-- Carrito -->
      <a href="/cart" class="position-relative text-decoration-none"
         style="color:var(--bs-primary);">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span th:if="${session.cart != null and !session.cart.isEmpty()}"
              class="cart-badge"
              th:text="${#lists.size(session.cart)}"></span>
      </a>

      <!-- Auth actions -->
      <div class="d-flex align-items-center gap-2">

        <!-- Not logged in -->
        <th:block th:if="${session.userId == null}">
          <a href="/auth/login" class="btn btn-sm"
             style="color:var(--color-muted); font-weight:600;">
            Iniciar sesión
          </a>
          <a href="/auth/register" class="btn btn-sm rounded-pill px-3"
             style="background-color:var(--bs-primary); color:#fff; font-weight:600;">
            Registrarse
          </a>
        </th:block>

        <!-- Logged in -->
        <th:block th:if="${session.userId != null}">
          <a th:href="@{/user/me}"
             class="d-flex align-items-center gap-2 text-decoration-none"
             style="color:var(--bs-primary); font-weight:600; font-size:0.875rem;">
            <span class="material-symbols-outlined" style="font-size:1.2rem;">account_circle</span>
            <span th:text="${session.username}">usuario</span>
          </a>
          <a href="/auth/logout" class="btn btn-sm rounded-pill px-3"
             style="border:1.5px solid var(--bs-primary); color:var(--bs-primary); font-weight:600;">
            Cerrar sesión
          </a>
        </th:block>

      </div>
    </div>

  </div>
</nav>

<!--
  PERSISTENCIA DEL CARRITO EN localStorage
  ─────────────────────────────────────────
  Lógica en 3 casos según el estado de session.cart (inlinado por Thymeleaf):

  1. session.cart == null   → sesión expirada o nueva.
     Si localStorage tiene ítems guardados Y no se ha intentado ya en esta pestaña
     (flag sessionStorage 'bs_cart_synced'), llama a POST /cart/sync y recarga.

  2. session.cart no vacío  → guardar snapshot mínimo {productId, quantity} en localStorage.

  3. session.cart vacío []  → carrito vaciado intencionalmente (checkout o eliminar todos).
     Limpia localStorage para evitar que se vuelva a restaurar.
-->
<script th:inline="javascript">
  /*<![CDATA[*/
  (function () {
    var sessionCart = /*[[${session.cart}]]*/ null;

    if (sessionCart === null) {
      // Caso 1: sesión sin carrito — intentar restaurar desde localStorage
      if (!sessionStorage.getItem('bs_cart_synced')) {
        var saved = localStorage.getItem('bs_cart');
        if (saved) {
          try {
            var items = JSON.parse(saved);
            if (items && items.length > 0) {
              sessionStorage.setItem('bs_cart_synced', '1');
              fetch('/cart/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: saved
              }).then(function (r) {
                if (r.ok) window.location.reload();
                else localStorage.removeItem('bs_cart');
              }).catch(function () {});
            }
          } catch (e) {
            localStorage.removeItem('bs_cart');
          }
        }
      }

    } else if (sessionCart.length > 0) {
      // Caso 2: carrito activo — guardar snapshot en localStorage
      var snapshot = sessionCart.map(function (item) {
        return { productId: item.productId, quantity: item.quantity };
      });
      localStorage.setItem('bs_cart', JSON.stringify(snapshot));
      sessionStorage.removeItem('bs_cart_synced');

    } else {
      // Caso 3: carrito vaciado explícitamente — limpiar localStorage
      localStorage.removeItem('bs_cart');
      sessionStorage.removeItem('bs_cart_synced');
    }
  })();
  /*]]>*/
</script>

</body>
</html>
