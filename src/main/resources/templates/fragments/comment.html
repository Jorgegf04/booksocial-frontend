<!--/*
  ============================================================
  Fragmento: comment
  Ruta: Se incluye en work/detail.html para renderizar comentarios
  Controlador: — (fragmento recursivo, sin controlador propio)
  Uso: th:replace="~{fragments/comment :: comment(...)}"

  Parámetros recibidos:
    - comment             : CommentResponseDTO → comentario actual a renderizar
    - work                : WorkResponseDTO    → obra a la que pertenece
    - loggedIn            : boolean            → true si hay usuario en sesión
    - sessionUserId       : Long               → ID del usuario autenticado (null si no hay sesión)
    - sessionRole         : String             → rol del usuario ("ADMIN", "REGISTERED", etc.)
    - reactionCounts      : Map<Long, Integer> → mapa comentarioId → número total de likes
    - userLikedCommentIds : Set<Long>          → IDs de comentarios que el usuario ya likeó

  Árbol jerárquico (recursividad):
    - comment.replies se itera con th:each; cada reply vuelve a llamar a este fragmento.
    - La profundidad máxima la controla el backend en CommentServiceImpl.
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  th:fragment con parámetros: Thymeleaf permite declarar fragmentos que reciben
  variables como si fuesen argumentos de una función.
  comment-card: flex row con gap entre avatar y contenido (main.css).
-->
<div th:fragment="comment(comment, work, loggedIn, sessionUserId, sessionRole, reactionCounts, userLikedCommentIds)"
     class="comment-card">

  <!--
    Avatar circular con la inicial del nombre de usuario.
    #strings.substring(...).toUpperCase(): función utilitaria de Thymeleaf.
    comment-avatar: círculo con fondo gris y texto verde (main.css).
  -->
  <div class="comment-avatar"
       th:text="${comment.username != null ? #strings.substring(comment.username, 0, 1).toUpperCase() : '?'}">
  </div>

  <!-- Cuerpo del comentario: crece para ocupar el espacio restante -->
  <!-- flex-grow-1: Bootstrap — hace que este div ocupe todo el ancho disponible -->
  <div class="flex-grow-1">

    <!-- Cabecera: nombre, fecha y etiqueta "(editado)" si aplica -->
    <div class="d-flex align-items-center gap-2 mb-1">
      <!--
        th:href="@{...}": construye la URL de forma segura.
        El ID del usuario viene del DTO del comentario (no de la sesión).
      -->
      <a th:href="@{'/user/' + ${comment.userId}}"
         class="comment-username text-decoration-none"
         th:text="${comment.username}">Usuario</a>
      <!--
        #temporals.format(): función Thymeleaf para formatear fechas Java (LocalDate/LocalDateTime).
        comment-date: texto pequeño y atenuado (main.css).
      -->
      <span class="comment-date"
            th:text="${comment.date != null ? #temporals.format(comment.date, 'dd MMM yyyy') : ''}"></span>
      <span th:if="${comment.edited}" class="comment-date">(editado)</span>
    </div>

    <!-- Contenido del comentario -->
    <p class="comment-body" th:text="${comment.content}"></p>

    <!-- Barra de acciones: like, responder, eliminar -->
    <!-- flex-wrap: permite que los botones bajen a la siguiente línea en pantallas pequeñas -->
    <div class="d-flex gap-3 align-items-center flex-wrap">

      <!-- Like para usuario autenticado: formulario POST (necesita sesión) -->
      <!--
        th:block th:if: muestra el formulario de like solo si el usuario está logueado.
        d-inline: evita que el <form> rompa el flujo flex del padre.
      -->
      <th:block th:if="${loggedIn}">
        <form th:action="@{/work/{wid}/comment/{cid}/reaction(wid=${work.id},cid=${comment.id})}"
              method="post" class="d-inline">
          <!--
            th:classappend: añade la clase solo si la condición es verdadera, sin borrar las existentes.
            comment-action--liked: cambia color y peso de fuente al estado "ya likeado" (main.css).
            userLikedCommentIds.contains(): Set<Long> con los IDs ya reaccionados por el usuario actual.
          -->
          <button type="submit" class="comment-action"
                  th:classappend="${userLikedCommentIds.contains(comment.id)} ? ' comment-action--liked' : ''">
            <!--
              th:classappend sobre el icono: añade material-symbols-filled para el icono relleno.
              comment-icon: reduce el tamaño del símbolo Material (main.css).
            -->
            <span class="material-symbols-outlined comment-icon"
                  th:classappend="${userLikedCommentIds.contains(comment.id)} ? ' material-symbols-filled' : ''">thumb_up</span>
            <!-- reactionCounts[comment.id]: acceso al mapa para obtener el contador de este comentario -->
            <span th:text="${reactionCounts[comment.id] != null ? reactionCounts[comment.id] : 0}">0</span>
          </button>
        </form>
      </th:block>

      <!-- Like para visitante (sin sesión): solo muestra el contador, sin acción -->
      <!--
        th:unless: es el opuesto de th:if — renderiza cuando la condición es FALSA.
        comment-action--guest: desactiva el cursor y pointer-events (main.css).
      -->
      <th:block th:unless="${loggedIn}">
        <span class="comment-action comment-action--guest">
          <span class="material-symbols-outlined comment-icon">thumb_up</span>
          <span th:text="${reactionCounts[comment.id] != null ? reactionCounts[comment.id] : 0}">0</span>
        </span>
      </th:block>

      <!-- Botón "Responder": visible solo si hay sesión activa -->
      <!--
        th:attr: asigna atributos HTML arbitrarios; aquí crea data-reply-target dinámico
        con el ID del comentario para que el JS del detail pueda mostrar el formulario.
      -->
      <button th:if="${loggedIn}" type="button" class="comment-action"
              th:attr="data-reply-target='reply-form-' + ${comment.id}">
        <span class="material-symbols-outlined comment-icon">reply</span>
        Responder
      </button>

      <!-- Botón "Eliminar": visible si el comentario es propio O el usuario es ADMIN -->
      <th:block th:if="${loggedIn and (comment.userId == sessionUserId or sessionRole == 'ADMIN')}">
        <form th:action="@{/work/{wid}/comment/{cid}/delete(wid=${work.id},cid=${comment.id})}"
              method="post" class="d-inline">
          <!-- comment-action--delete: color rojo de peligro (main.css) -->
          <button type="submit" class="comment-action comment-action--delete"
                  onclick="return confirm('¿Eliminar este comentario?')">
            <span class="material-symbols-outlined comment-icon">delete</span>
            Eliminar
          </button>
        </form>
      </th:block>

    </div>

    <!-- Formulario de respuesta: oculto por defecto, JS lo muestra al pulsar "Responder" -->
    <!--
      comment-reply-form: display:none + margin-top (main.css).
      th:id dinámico: cada comentario tiene su propio formulario oculto con ID único.
    -->
    <div th:id="'reply-form-' + ${comment.id}" class="comment-reply-form">
      <form th:action="@{/work/{wid}/comment/{pid}/reply(wid=${work.id},pid=${comment.id})}"
            method="post">
        <!-- comment-reply-textarea: ancho completo con redimensión vertical (main.css) -->
        <textarea name="content" rows="2"
                  placeholder="Escribe tu respuesta..."
                  required minlength="1" maxlength="1000"
                  class="comment-reply-textarea"></textarea>
        <div class="d-flex gap-2 justify-content-end mt-2">
          <!--
            comment-reply-btn: reduce el font-size de los botones del formulario (main.css).
            data-reply-target: el JS lo usa para ocultar este formulario al cancelar.
          -->
          <button type="button" class="btn-ghost-pill comment-reply-btn"
                  th:attr="data-reply-target='reply-form-' + ${comment.id}">
            Cancelar
          </button>
          <!-- comment-reply-btn--submit: añade padding al botón de envío (main.css) -->
          <button type="submit" class="btn-primary-pill comment-reply-btn comment-reply-btn--submit">
            Responder
          </button>
        </div>
      </form>
    </div>

    <!-- Árbol de respuestas: recursividad Thymeleaf -->
    <!--
      th:if con condición compuesta: evita renderizar el bloque si no hay respuestas.
      th:each="reply : ${comment.replies}": itera la lista de respuestas del comentario actual.
      th:replace recursivo: vuelve a llamar a este mismo fragmento con cada respuesta como raíz.
    -->
    <div class="reply-thread mt-3"
         th:if="${comment.replies != null and !comment.replies.isEmpty()}">
      <div th:each="reply : ${comment.replies}" class="mb-3">
        <div th:replace="~{fragments/comment :: comment(${reply}, ${work}, ${loggedIn}, ${sessionUserId}, ${sessionRole}, ${reactionCounts}, ${userLikedCommentIds})}"></div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
