<!--/*
  ============================================================
  Vista: Inicio de sesión
  Ruta: /auth/login
  Controlador: AuthController#loginForm() (GET) / AuthController#login() (POST)

  Recibe del modelo:
    - loginRequest : LoginRequestDTO → objeto de binding del formulario (username, password)
    - error        : String (opcional) → mensaje si las credenciales son incorrectas
    - success      : String (opcional) → mensaje de éxito tras un registro correcto

  Flujo de autenticación:
    1. El formulario envía POST /auth/login con username y password.
    2. AuthController llama a AuthClientService.login() → POST /api/auth/login.
    3. Si el backend devuelve JWT, se guardan en sesión HTTP:
         session["JWT"], session["userId"], session["username"], session["role"]
    4. Se redirige a /home; los administradores pueden acceder a /admin/**.

  Fragmentos incluidos: ninguno
  (página standalone sin navbar para evitar ruido visual en el flujo de auth)
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap">
  <!-- Estilos globales: variables de color CSS -->
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos del área de autenticación (compartido con register.html) -->
  <link rel="stylesheet" th:href="@{/css/pages/public/auth.css}">
</head>
<body>

<!--
  auth-wrapper: flex row que ocupa el 100vh, definido en auth.css.
  Los dos hijos directos son el panel decorativo y el panel del formulario.
-->
<div class="auth-wrapper">

  <!-- Panel izquierdo decorativo: visible solo en pantallas >= 768px (auth.css media query) -->
  <div class="auth-panel">
    <!-- auth-brand: logo tipográfico con serif itálica verde claro -->
    <div class="auth-brand"><span>Book</span>Social</div>

    <!-- Cita literaria central del panel -->
    <div class="auth-panel-middle">
      <!-- auth-panel-quote: serif itálica grande sobre fondo oscuro -->
      <p class="auth-panel-quote">
        "Un libro es un sueño que tienes en tus manos."
      </p>
      <!-- auth-panel-sub: atribución de la cita en mayúsculas pequeñas -->
      <p class="auth-panel-sub">Neil Gaiman</p>
    </div>

    <p class="auth-panel-footer">
      © 2026 BookSocial — El Curador Digital
    </p>
  </div>

  <!-- Panel derecho: formulario de inicio de sesión -->
  <!-- auth-form-side: flex centrado vertical y horizontal con fondo neutro -->
  <div class="auth-form-side">
    <!-- auth-card: limita el ancho del formulario a 420px -->
    <div class="auth-card">

      <h1 class="auth-card-title">Bienvenido de nuevo</h1>
      <p class="auth-card-sub">Inicia sesión para acceder a tu biblioteca</p>

      <!-- Alerta de éxito: se muestra tras un registro exitoso (flash attribute) -->
      <!--
        th:if: Thymeleaf solo renderiza este div si ${success} existe en el modelo.
        alert alert-success: estilos de Bootstrap para alertas verdes.
        auth-alert-text: reduce el font-size al 0.85rem (auth.css).
        th:text: inserta el contenido del mensaje en el elemento.
      -->
      <div th:if="${success}"
           class="alert alert-success py-2 mb-3 auth-alert-text"
           th:text="${success}"></div>

      <!-- Alerta de error de credenciales -->
      <div th:if="${error}"
           class="alert alert-danger py-2 mb-3 auth-alert-text"
           th:text="${error}"></div>

      <!--
        th:action: Thymeleaf genera la URL del formulario con el contexto de la app.
        th:object: vincula el formulario al DTO; permite usar *{campo} en los campos.
      -->
      <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
        <div class="mb-3">
          <!-- auth-label: pequeño y en negrita, más legible que el label de Bootstrap -->
          <label class="auth-label">Nombre de usuario</label>
          <!--
            th:field="*{username}": Thymeleaf genera name, id y value desde el DTO.
            Equivale a name="username" id="username" value="${loginRequest.username}".
          -->
          <input type="text"
                 th:field="*{username}"
                 class="form-control auth-input"
                 placeholder="tu_usuario"
                 autocomplete="username"
                 required>
        </div>

        <div class="mb-4">
          <!-- d-flex justify-content-between: espacio entre label y enlace "¿Olvidaste?" -->
          <div class="d-flex justify-content-between align-items-center">
            <label class="auth-label mb-0">Contraseña</label>
          </div>
          <!-- auth-input-group: position:relative para que el botón ojo se superponga -->
          <div class="auth-input-group mt-1">
            <input type="password"
                   id="loginPassword"
                   th:field="*{password}"
                   class="form-control auth-input"
                   placeholder="••••••••"
                   autocomplete="current-password"
                   required>
            <!-- auth-pw-toggle: botón absolutamente posicionado en el lado derecho del input -->
            <button type="button" class="auth-pw-toggle" onclick="togglePw('loginPassword', this)"
                    title="Mostrar/ocultar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- auth-btn: botón verde de ancho completo -->
        <button type="submit" class="auth-btn">Iniciar sesión</button>
      </form>

      <!-- Separador visual con líneas a los lados -->
      <div class="auth-divider">o</div>

      <!-- Enlace al registro -->
      <!-- auth-switch-text: tamaño y color del párrafo de cambio de vista (auth.css) -->
      <p class="text-center mb-0 auth-switch-text">
        ¿No tienes cuenta?
        <!-- auth-link: verde y sin subrayado por defecto; subrayado al hover -->
        <a href="/auth/register" class="auth-link ms-1">Crear cuenta</a>
      </p>
    </div>
  </div>

</div>

<script>
  /**
   * Alterna el tipo del input de contraseña entre "password" y "text".
   * @param {string} inputId - ID del input a alternar
   * @param {HTMLElement} btn - Botón que llama a la función (no usado actualmente)
   */
  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
