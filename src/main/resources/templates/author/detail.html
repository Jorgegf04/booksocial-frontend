<!--/*
  ============================================================
  Vista: Detalle de autor
  Ruta: /author/{id}
  Controlador: AuthorController#detail() (GET)

  Recibe del modelo:
    - author       : AuthorResponseDTO — datos completos del autor
                     (nombre, foto, nacionalidad, birthDate, obras, followerCount).
    - loggedIn     : boolean           — true si hay sesión activa.
    - following    : boolean           — true si el usuario en sesión ya sigue al autor.
    - followSuccess : String (opcional) — mensaje flash tras seguir con éxito.
    - followError   : String (opcional) — mensaje flash si el follow falló.

  Estructura de la página:
    · Columna izquierda (col-lg-4): foto, nombre, stats, botón seguir/dejar de seguir.
    · Columna derecha (col-lg-8): grid de obras del autor con portadas escalonadas.

  Fragmentos incluidos:
    - fragments/navbar :: navbar
    - fragments/footer :: footer
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${author.name} + ' — BookSocial'">Autor — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos del listado y detalle de autores (compartido con list.html) -->
  <link rel="stylesheet" th:href="@{/css/pages/public/author.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- author-main: padding-top compensa la navbar fixed (author.css) -->
<main class="container author-main">

  <!-- Mensajes flash de seguir / dejar de seguir -->
  <!--
    alert alert-success/danger: Bootstrap — cajas de notificación verde/roja.
    alert-dismissible: Bootstrap — añade el botón de cierre (×).
    fade show: Bootstrap — animación de entrada del alert.
    data-bs-dismiss="alert": Bootstrap JS — cierra el alert al hacer clic.
  -->
  <div th:if="${followSuccess}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
    <span class="material-symbols-outlined align-middle me-1 author-search-icon">check_circle</span>
    <span th:text="${followSuccess}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${followError}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
    <span th:text="${followError}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Layout de dos columnas: aside izquierda + section derecha -->
  <div class="row g-5">

    <!-- ═══ COLUMNA IZQUIERDA: Ficha del autor ═══ -->
    <aside class="col-lg-4">
      <!--
        sticky-top: Bootstrap — hace que el aside se quede fijo al hacer scroll.
        author-detail-sticky: top:6rem para no quedar bajo la navbar (author.css).
      -->
      <div class="sticky-top author-detail-sticky">

        <!-- Foto del autor: aspecto 3:4 -->
        <!--
          author-detail-photo: aspect-ratio:3/4 + fondo gris (author.css).
          rounded-lg: border-radius más pronunciado.
          overflow-hidden: Bootstrap — recorta la foto al border-radius.
        -->
        <div class="mb-4 rounded-lg overflow-hidden author-detail-photo">
          <img th:if="${author.img != null and !author.img.isEmpty()}"
               th:src="${author.img}" th:alt="${author.name}">
          <!--
            author-detail-photo-placeholder: mismo fondo gris que el wrapper (author.css).
            author-detail-placeholder-icon: icono de persona a 6rem (author.css).
          -->
          <div th:unless="${author.img != null and !author.img.isEmpty()}"
               class="d-flex align-items-center justify-content-center h-100 author-detail-photo-placeholder">
            <span class="material-symbols-outlined author-detail-placeholder-icon">person</span>
          </div>
        </div>

        <!-- Nombre del autor y su nacionalidad -->
        <!-- author-detail-name: serif grande en color primary (author.css) -->
        <h1 class="font-serif mb-1 author-detail-name"
            th:text="${author.name}">Nombre del autor</h1>
        <!--
          author-detail-nationality: uppercase + letter-spacing + color muted (author.css).
        -->
        <p class="mb-3 author-detail-nationality"
           th:text="${author.nationality != null ? author.nationality : ''}"></p>

        <!-- Bloque de estadísticas: seguidores, obras, año de nacimiento -->
        <!--
          author-detail-stats: border-top y border-bottom (author.css).
          py-3: Bootstrap — padding vertical para separar del nombre y los botones.
        -->
        <div class="d-flex gap-4 py-3 mb-4 author-detail-stats">
          <div>
            <!--
              author-stat-num: serif grande en color primary (author.css).
              author-stat-label: uppercase muy pequeño + color muted (author.css).
            -->
            <div class="font-serif fw-bold author-stat-num"
                 th:text="${author.followerCount != null ? author.followerCount : 0}">0</div>
            <div class="author-stat-label">Seguidores</div>
          </div>
          <div>
            <!-- #lists.size(): utilidad Thymeleaf para contar elementos de una lista -->
            <div class="font-serif fw-bold author-stat-num"
                 th:text="${author.works != null ? #lists.size(author.works) : 0}">0</div>
            <div class="author-stat-label">Obras</div>
          </div>
          <div th:if="${author.birthDate != null}">
            <!-- #temporals.year(): extrae solo el año de un LocalDate -->
            <div class="font-serif fw-bold author-stat-num"
                 th:text="${#temporals.year(author.birthDate)}">—</div>
            <div class="author-stat-label">Nacimiento</div>
          </div>
        </div>

        <!-- Botones de acción: solo si hay sesión activa -->
        <!--
          th:block: contenedor lógico de Thymeleaf sin HTML propio.
          th:if="${loggedIn}": solo renderiza si hay sesión.
        -->
        <th:block th:if="${loggedIn}">

          <!--
            th:if="${!following}": muestra "Seguir" si aún no sigue al autor.
            btn-primary-pill: botón verde de ancho completo (main.css).
            author-action-btn: modificador de padding para este contexto (author.css).
          -->
          <form th:if="${!following}" th:action="@{'/author/' + ${author.id} + '/follow'}" method="post">
            <button type="submit"
                    class="btn-primary-pill w-100 d-flex align-items-center justify-content-center gap-2 author-action-btn">
              <span class="material-symbols-outlined author-search-icon">person_add</span>
              Seguir autor
            </button>
          </form>

          <!--
            th:if="${following}": muestra "Siguiendo ✓" si ya sigue al autor.
            author-unfollow-btn: ghost pill con mismo padding que el botón de seguir (author.css).
            w-100 d-flex: Bootstrap — ancho completo + flex para alinear icono y texto.
          -->
          <form th:if="${following}" th:action="@{'/author/' + ${author.id} + '/unfollow'}" method="post">
            <button type="submit"
                    class="w-100 d-flex align-items-center justify-content-center gap-2 author-unfollow-btn">
              <span class="material-symbols-outlined author-search-icon">how_to_reg</span>
              Siguiendo ✓
            </button>
          </form>

        </th:block>

        <!-- Sin sesión: enlace directo al login -->
        <!--
          th:unless="${loggedIn}": renderiza solo si NO hay sesión.
          d-block text-center: Bootstrap — convierte el enlace en bloque centrado.
        -->
        <a th:unless="${loggedIn}" href="/auth/login"
           class="btn-primary-pill d-block text-center text-decoration-none author-action-btn">
          Inicia sesión para seguir
        </a>

      </div>
    </aside>

    <!-- ═══ COLUMNA DERECHA: Obras del autor ═══ -->
    <section class="col-lg-8">

      <!-- Cabecera con línea decorativa -->
      <div class="d-flex align-items-end gap-3 mb-5">
        <!-- author-works-heading: font-serif + color primary (author.css) -->
        <h2 class="font-serif mb-0 author-works-heading">Obras del autor</h2>
        <!-- author-works-divider: border-bottom sutil hasta el final de la fila (author.css) -->
        <div class="flex-grow-1 author-works-divider"></div>
      </div>

      <!-- Estado vacío: sin obras registradas para este autor -->
      <div th:if="${author.works == null or author.works.isEmpty()}"
           class="text-center py-5 author-empty">
        <span class="material-symbols-outlined d-block mb-2 author-empty-icon">menu_book</span>
        <p class="font-serif mb-1 author-works-empty-text">
          Aún no hay obras registradas para este autor.
        </p>
      </div>

      <!-- Grid de obras con diseño escalonado: cada columna impar baja 5rem -->
      <!--
        row g-5: Bootstrap — grid con gutters amplios para el diseño editorial.
        th:unless: renderiza si la lista de obras NO está vacía.
      -->
      <div class="row g-5" th:unless="${author.works == null or author.works.isEmpty()}">

        <!--
          th:classappend="${iterStat.index % 2 == 1} ? ' mt-5'":
          añade margin-top al índice impar para crear el efecto escalonado.
          iterStat: objeto de estado del bucle — iterStat.index es el índice 0-based.
        -->
        <div th:each="work, iterStat : ${author.works}"
             th:classappend="${iterStat.index % 2 == 1} ? ' mt-5'"
             class="col-sm-6">

          <!--
            group-work: tiene reglas de hover en author.css (transform img, opacity h3).
            text-decoration-none d-block: Bootstrap — enlace sin subrayado de ancho completo.
          -->
          <a th:href="@{'/work/' + ${work.id}}" class="text-decoration-none d-block group-work">

            <!-- Portada: aspecto 2:3 con badge superpuesto -->
            <!--
              author-work-cover: aspect-ratio:2/3 + bg gris + position:relative (author.css).
              overflow-hidden: Bootstrap — recorta la imagen y el badge al border-radius.
            -->
            <div class="overflow-hidden mb-3 author-work-cover">
              <img th:if="${work.img != null and !work.img.isEmpty()}"
                   th:src="${work.img}" th:alt="${work.title}">
              <div th:unless="${work.img != null and !work.img.isEmpty()}"
                   class="d-flex align-items-center justify-content-center h-100">
                <span class="material-symbols-outlined author-work-cover-icon">menu_book</span>
              </div>

              <!--
                author-work-genre-badge: pastilla de género superpuesta en esquina (author.css).
                position-absolute: Bootstrap — posiciona el badge relativo al contenedor.
              -->
              <span th:if="${work.genre != null}"
                    th:text="${work.genre}"
                    class="position-absolute author-work-genre-badge"></span>
            </div>

            <!-- Título y metadatos de la obra -->
            <!-- author-work-title: serif + color primary + transition opacity (author.css) -->
            <h3 class="font-serif mb-1 author-work-title"
                th:text="${work.title}">Título</h3>
            <!--
              author-work-meta: uppercase pequeño + letter-spacing (author.css).
              #temporals.year(): extrae solo el año de la fecha de publicación.
            -->
            <p class="author-work-meta"
               th:text="${(work.type != null ? work.type : '') + (work.publicationDate != null ? ' · ' + #temporals.year(work.publicationDate) : '')}"></p>

          </a>
        </div>
      </div>

    </section>
  </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
