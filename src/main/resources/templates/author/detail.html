<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${author.name} + ' — BookSocial'">Autor — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container" style="padding-top:6rem; padding-bottom:5rem;">

  <!-- Flash messages -->
  <div th:if="${followSuccess}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
    <span class="material-symbols-outlined align-middle me-1" style="font-size:1.1rem;">check_circle</span>
    <span th:text="${followSuccess}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${followError}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
    <span th:text="${followError}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row g-5">

    <!-- ═══ COLUMNA IZQUIERDA: Ficha del autor ═══ -->
    <aside class="col-lg-4">
      <div class="sticky-top" style="top:6rem;">

        <!-- Foto -->
        <div class="mb-4 rounded-lg overflow-hidden"
             style="aspect-ratio:3/4; background:var(--color-surface-l);">
          <img th:if="${author.img != null and !author.img.isEmpty()}"
               th:src="${author.img}" th:alt="${author.name}"
               style="width:100%; height:100%; object-fit:cover;">
          <div th:unless="${author.img != null and !author.img.isEmpty()}"
               class="d-flex align-items-center justify-content-center h-100"
               style="background:var(--color-surface-l);">
            <span class="material-symbols-outlined"
                  style="font-size:6rem; color:var(--color-outline-l);">person</span>
          </div>
        </div>

        <!-- Nombre y nacionalidad -->
        <h1 class="font-serif mb-1" style="font-size:2rem; color:var(--bs-primary);"
            th:text="${author.name}">Nombre del autor</h1>
        <p class="mb-3" style="color:var(--color-muted); font-size:0.85rem; letter-spacing:.08em; text-transform:uppercase;"
           th:text="${author.nationality != null ? author.nationality : ''}"></p>

        <!-- Estadísticas -->
        <div class="d-flex gap-4 py-3 mb-4"
             style="border-top:1px solid var(--color-outline-l); border-bottom:1px solid var(--color-outline-l);">
          <div>
            <div class="font-serif fw-bold" style="font-size:1.5rem; color:var(--bs-primary);"
                 th:text="${author.followerCount != null ? author.followerCount : 0}">0</div>
            <div style="font-size:0.72rem; color:var(--color-muted); text-transform:uppercase; letter-spacing:.08em;">Seguidores</div>
          </div>
          <div>
            <div class="font-serif fw-bold" style="font-size:1.5rem; color:var(--bs-primary);"
                 th:text="${author.works != null ? #lists.size(author.works) : 0}">0</div>
            <div style="font-size:0.72rem; color:var(--color-muted); text-transform:uppercase; letter-spacing:.08em;">Obras</div>
          </div>
          <div th:if="${author.birthDate != null}">
            <div class="font-serif fw-bold" style="font-size:1.5rem; color:var(--bs-primary);"
                 th:text="${#temporals.year(author.birthDate)}">—</div>
            <div style="font-size:0.72rem; color:var(--color-muted); text-transform:uppercase; letter-spacing:.08em;">Nacimiento</div>
          </div>
        </div>

        <!-- Botón seguir / dejar de seguir (solo con sesión) -->
        <th:block th:if="${loggedIn}">

          <form th:if="${!following}" th:action="@{'/author/' + ${author.id} + '/follow'}" method="post">
            <button type="submit" class="btn-primary-pill w-100 d-flex align-items-center justify-content-center gap-2"
                    style="padding:.75rem;">
              <span class="material-symbols-outlined" style="font-size:1.1rem;">person_add</span>
              Seguir autor
            </button>
          </form>

          <form th:if="${following}" th:action="@{'/author/' + ${author.id} + '/unfollow'}" method="post">
            <button type="submit" class="w-100 d-flex align-items-center justify-content-center gap-2"
                    style="padding:.75rem; font-weight:600; border:1.5px solid var(--bs-primary);
                           border-radius:2rem; background:transparent; color:var(--bs-primary); cursor:pointer;">
              <span class="material-symbols-outlined" style="font-size:1.1rem;">how_to_reg</span>
              Siguiendo ✓
            </button>
          </form>

        </th:block>

        <!-- Sin sesión -->
        <a th:unless="${loggedIn}" href="/auth/login"
           class="btn-primary-pill d-block text-center text-decoration-none"
           style="padding:.75rem;">
          Inicia sesión para seguir
        </a>

      </div>
    </aside>

    <!-- ═══ COLUMNA DERECHA: Obras ═══ -->
    <section class="col-lg-8">

      <div class="d-flex align-items-end gap-3 mb-5">
        <h2 class="font-serif mb-0" style="font-size:1.8rem; color:var(--bs-primary);">Obras del autor</h2>
        <div class="flex-grow-1" style="border-bottom:1px solid var(--color-outline-l); margin-bottom:4px;"></div>
      </div>

      <!-- Sin obras -->
      <div th:if="${author.works == null or author.works.isEmpty()}"
           class="text-center py-5" style="background:var(--color-surface-l); border-radius:1rem;">
        <span class="material-symbols-outlined d-block mb-2"
              style="font-size:3.5rem; color:var(--color-outline-l);">menu_book</span>
        <p class="font-serif mb-1" style="color:var(--bs-primary); font-size:1rem;">
          Aún no hay obras registradas para este autor.
        </p>
      </div>

      <!-- Grid de obras (diseño escalonado 2 columnas) -->
      <div class="row g-5" th:unless="${author.works == null or author.works.isEmpty()}">
        <div th:each="work, iterStat : ${author.works}"
             th:classappend="${iterStat.index % 2 == 1} ? ' mt-5'"
             class="col-sm-6">
          <a th:href="@{'/work/' + ${work.id}}" class="text-decoration-none d-block group-work">

            <!-- Portada -->
            <div class="overflow-hidden mb-3"
                 style="aspect-ratio:2/3; background:var(--color-surface-l); border-radius:.25rem; position:relative;">
              <img th:if="${work.img != null and !work.img.isEmpty()}"
                   th:src="${work.img}" th:alt="${work.title}"
                   style="width:100%; height:100%; object-fit:cover; transition:transform .6s ease;">
              <div th:unless="${work.img != null and !work.img.isEmpty()}"
                   class="d-flex align-items-center justify-content-center h-100">
                <span class="material-symbols-outlined"
                      style="font-size:4rem; color:var(--color-outline-l);">menu_book</span>
              </div>

              <!-- Badge de género -->
              <span th:if="${work.genre != null}"
                    th:text="${work.genre}"
                    class="position-absolute"
                    style="top:.75rem; right:.75rem; background:var(--color-surface-l);
                           color:var(--bs-primary); font-size:.65rem; font-weight:700;
                           padding:.25rem .6rem; border-radius:.25rem; letter-spacing:.06em;
                           text-transform:uppercase;"></span>
            </div>

            <!-- Info -->
            <h3 class="font-serif mb-1"
                style="font-size:1.1rem; color:var(--bs-primary); transition:opacity .2s;"
                th:text="${work.title}">Título</h3>
            <p style="font-size:.75rem; color:var(--color-muted); letter-spacing:.07em; text-transform:uppercase;"
               th:text="${(work.type != null ? work.type : '') + (work.publicationDate != null ? ' · ' + #temporals.year(work.publicationDate) : '')}"></p>

          </a>
        </div>
      </div>

    </section>
  </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  .group-work:hover img { transform: scale(1.04); }
  .group-work:hover h3  { opacity: .75; }
</style>
</body>
</html>
