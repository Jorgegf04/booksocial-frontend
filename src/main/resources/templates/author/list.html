<!--/*
  ============================================================
  Vista: Listado de autores
  Ruta: /authors
  Controlador: AuthorController#list() (GET)

  Recibe del modelo:
    - authors : List<AuthorSummaryResponseDTO> — autores a mostrar (filtrados por q si se busca).
    - q       : String (opcional)              — término de búsqueda pre-cargado en el input.

  Funcionalidades:
    · Formulario GET con parámetro q → recarga la página filtrando autores por nombre.
    · Si authors está vacío o es null → muestra el estado vacío.
    · Cards de autor: foto, nombre, nacionalidad, nº de obras y seguidores.
    · Enlace en cada card → /author/{id} para ver el detalle del autor.

  Fragmentos incluidos:
    - fragments/navbar :: navbar
    - fragments/footer :: footer
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autores — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos del listado y detalle de autores -->
  <link rel="stylesheet" th:href="@{/css/pages/public/author.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- author-main: padding-top compensa la navbar fixed (author.css) -->
<main class="container author-main">

  <!-- Cabecera: título + buscador alineados con justify-content-between -->
  <div class="d-flex align-items-end justify-content-between mb-4 flex-wrap gap-3">
    <div>
      <!-- filter-section-title: etiqueta de sección en uppercase pequeño (main.css) -->
      <p class="filter-section-title mb-1">Catálogo</p>
      <!-- author-list-heading: font-size:2rem + color primary (author.css) -->
      <h1 class="font-serif mb-0 author-list-heading">Autores</h1>
    </div>

    <!--
      Formulario de búsqueda GET: no usa POST porque la búsqueda
      debe ser compartible por URL (/authors?q=tolkien).
      author-search-group: limita el ancho del input-group (author.css).
    -->
    <form action="/authors" method="get" id="authorFilterForm" class="d-flex gap-2 flex-wrap align-items-center">
      <input type="hidden" name="page" id="authorPageInput" value="0">
      <select name="nationality"
              class="form-select form-select-sm author-search-input"
              style="width:auto;min-width:160px"
              onchange="this.form.submit()">
        <option value="" th:selected="${nationality == null or nationality == ''}">Todas las nacionalidades</option>
        <option th:each="nat : ${nationalities}"
                th:value="${nat}"
                th:text="${nat}"
                th:selected="${nat == nationality}">
        </option>
      </select>
      <div class="input-group author-search-group">
        <input name="q" type="text"
               th:value="${q}"
               class="form-control form-control-sm author-search-input"
               placeholder="Buscar autor...">
        <button type="submit" class="input-group-text author-search-btn">
          <span class="material-symbols-outlined author-search-icon">search</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Estado vacío: se muestra si no hay autores en el resultado -->
  <!--
    th:if: Thymeleaf solo renderiza este div si la lista es null o está vacía.
    author-empty: fondo gris claro + border-radius (author.css).
  -->
  <div th:if="${authors == null or authors.isEmpty()}"
       class="text-center py-5 author-empty">
    <span class="material-symbols-outlined d-block mb-2 author-empty-icon">person_search</span>
    <p class="font-serif mb-1 author-empty-text">
      No se encontraron autores.
    </p>
  </div>

  <!-- Grid de autores: 4 columnas en escritorio, 2 en tablet, 1 en móvil -->
  <!--
    th:unless: lo opuesto de th:if — renderiza si la lista NO está vacía.
    row g-4: Bootstrap — grid con gutters de 1.5rem entre cards.
  -->
  <div class="row g-4" th:unless="${authors == null or authors.isEmpty()}">

    <!--
      th:each="a : ${authors}": itera sobre la lista de autores.
      col-sm-6 col-md-4 col-lg-3: 1 col en xs, 2 en sm, 3 en md, 4 en lg.
    -->
    <div th:each="a : ${authors}" class="col-sm-6 col-md-4 col-lg-3">
      <!--
        author-card: tiene reglas de hover (author.css) que afectan a img y h3 hijos.
        text-decoration-none: Bootstrap — quita el subrayado del enlace.
        d-block: Bootstrap — el <a> ocupa toda la celda de la grid.
        th:href con concatenación de string: genera /author/{id}.
      -->
      <a th:href="@{'/author/' + ${a.id}}" class="text-decoration-none d-block author-card">

        <!--
          author-card-img-wrap: aspecto 3:4 + fondo gris claro + border-radius (author.css).
          overflow-hidden: Bootstrap — recorta la imagen al border-radius.
          mb-3: Bootstrap — espacio entre la imagen y el texto.
        -->
        <div class="overflow-hidden mb-3 author-card-img-wrap">
          <!--
            th:if / th:unless: muestra imagen si existe, placeholder si no.
            author-card-img-wrap img: width/height/object-fit/transition (author.css).
          -->
          <img th:if="${a.img != null and !a.img.isEmpty()}"
               th:src="${a.img}" th:alt="${a.name}">
          <div th:unless="${a.img != null and !a.img.isEmpty()}"
               class="d-flex align-items-center justify-content-center h-100">
            <!-- author-card-placeholder-icon: icono grande en gris claro (author.css) -->
            <span class="material-symbols-outlined author-card-placeholder-icon">person</span>
          </div>
        </div>

        <!-- Nombre del autor -->
        <!-- author-card-name: font-size:1rem + color primary (author.css) -->
        <h3 class="font-serif mb-0 author-card-name"
            th:text="${a.name}">Nombre</h3>

        <!-- Nacionalidad y número de obras (concatenados con ·) -->
        <!--
          author-card-meta: font-size pequeño + color muted + margin-top (author.css).
          Operador ternario en Thymeleaf: condición ? 'si' : 'no'.
          #lists.size(): utilidad Thymeleaf para obtener el tamaño de una lista.
        -->
        <p class="author-card-meta"
           th:text="${(a.nationality != null ? a.nationality : '') +
                      (a.works != null and !a.works.isEmpty() ? ' · ' + #lists.size(a.works) + ' obras' : '')}"></p>

        <!-- Número de seguidores -->
        <p class="author-card-followers"
           th:text="${(a.followerCount != null ? a.followerCount : 0) + ' seguidores'}"></p>

      </a>
    </div>

  </div>

  <!-- PAGINACIÓN: solo visible si hay más de una página -->
  <nav th:if="${totalPages > 1}" class="mt-5 d-flex justify-content-center" aria-label="Paginación de autores">
    <ul class="pagination pagination-bs gap-1 mb-0">

      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
        <a class="page-link" href="#"
           th:onclick="${currentPage > 0} ? 'goToAuthorPage(' + ${currentPage - 1} + '); return false;' : 'return false;'"
           aria-label="Anterior">
          <span class="material-symbols-outlined catalog-pager-icon">chevron_left</span>
        </a>
      </li>

      <th:block th:each="p : ${pageNumbers}">
        <li class="page-item disabled" th:if="${p == -1}">
          <span class="page-link catalog-ellipsis">···</span>
        </li>
        <li class="page-item" th:if="${p != -1}"
            th:classappend="${p == currentPage} ? 'active'">
          <a class="page-link" href="#"
             th:onclick="'goToAuthorPage(' + ${p} + '); return false;'"
             th:text="${p + 1}">1</a>
        </li>
      </th:block>

      <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
        <a class="page-link" href="#"
           th:onclick="${currentPage < totalPages - 1} ? 'goToAuthorPage(' + ${currentPage + 1} + '); return false;' : 'return false;'"
           aria-label="Siguiente">
          <span class="material-symbols-outlined catalog-pager-icon">chevron_right</span>
        </a>
      </li>

    </ul>
  </nav>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function goToAuthorPage(pageNum) {
    document.getElementById('authorPageInput').value = pageNum;
    document.getElementById('authorFilterForm').submit();
  }
</script>
</body>
</html>
