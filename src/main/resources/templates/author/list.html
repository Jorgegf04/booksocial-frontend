<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autores — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container" style="padding-top:6rem; padding-bottom:5rem;">

  <!-- Cabecera -->
  <div class="d-flex align-items-end justify-content-between mb-4 flex-wrap gap-3">
    <div>
      <p class="filter-section-title mb-1">Catálogo</p>
      <h1 class="font-serif mb-0" style="font-size:2rem; color:var(--bs-primary);">Autores</h1>
    </div>
    <form action="/authors" method="get" class="d-flex gap-2">
      <div class="input-group" style="max-width:280px;">
        <input name="q" type="text"
               th:value="${q}"
               class="form-control form-control-sm"
               style="border-radius:2rem 0 0 2rem;"
               placeholder="Buscar autor...">
        <button type="submit" class="input-group-text"
                style="border-radius:0 2rem 2rem 0; background:var(--bs-primary); border:none; cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size:1rem; color:#fff;">search</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Sin autores -->
  <div th:if="${authors == null or authors.isEmpty()}"
       class="text-center py-5" style="background:var(--color-surface-l); border-radius:1rem;">
    <span class="material-symbols-outlined d-block mb-2"
          style="font-size:3.5rem; color:var(--color-outline-l);">person_search</span>
    <p class="font-serif mb-1" style="color:var(--bs-primary); font-size:1.1rem;">
      No se encontraron autores.
    </p>
  </div>

  <!-- Grid de autores -->
  <div class="row g-4" th:unless="${authors == null or authors.isEmpty()}">
    <div th:each="a : ${authors}" class="col-sm-6 col-md-4 col-lg-3">
      <a th:href="@{'/author/' + ${a.id}}" class="text-decoration-none d-block author-card">

        <div class="overflow-hidden mb-3"
             style="aspect-ratio:3/4; background:var(--color-surface-l); border-radius:.5rem;">
          <img th:if="${a.img != null and !a.img.isEmpty()}"
               th:src="${a.img}" th:alt="${a.name}"
               style="width:100%; height:100%; object-fit:cover; transition:transform .5s;">
          <div th:unless="${a.img != null and !a.img.isEmpty()}"
               class="d-flex align-items-center justify-content-center h-100">
            <span class="material-symbols-outlined"
                  style="font-size:4rem; color:var(--color-outline-l);">person</span>
          </div>
        </div>

        <h3 class="font-serif mb-0"
            style="font-size:1rem; color:var(--bs-primary);"
            th:text="${a.name}">Nombre</h3>
        <p style="font-size:.75rem; color:var(--color-muted); margin:.2rem 0 0;"
           th:text="${(a.nationality != null ? a.nationality : '') +
                      (a.works != null and !a.works.isEmpty() ? ' · ' + #lists.size(a.works) + ' obras' : '')}"></p>
        <p style="font-size:.72rem; color:var(--color-muted);"
           th:text="${(a.followerCount != null ? a.followerCount : 0) + ' seguidores'}"></p>

      </a>
    </div>
  </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  .author-card:hover img { transform: scale(1.04); }
  .author-card:hover h3  { opacity: .75; }
</style>
</body>
</html>
