<!--
  Vista: Página de error genérica — devuelta por GlobalExceptionHandler (@ControllerAdvice)

  Variables del modelo:
  - errorStatus  : int    código HTTP (503, 500, 502, 404…)
  - errorTitle   : String título corto del error
  - errorMessage : String descripción del problema
  - errorPath    : String ruta de la petición que falló (opcional)
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${errorTitle} + ' — BookSocial'">Error — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    body {
      background-color: #fcf9f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', sans-serif;
    }
    .error-box {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 32px rgba(45,76,62,0.09);
      text-align: center;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: #2D4C3E;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1c1c18;
      margin: 0.75rem 0 0.5rem;
    }
    .error-msg {
      font-size: 0.9rem;
      color: #414844;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-path {
      font-size: 0.75rem;
      color: #727974;
      background: #f0eee8;
      border-radius: 0.5rem;
      padding: 0.3rem 0.75rem;
      display: inline-block;
      margin-bottom: 1.75rem;
      font-family: monospace;
    }
    .btn-back {
      background: #2D4C3E;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: background .15s;
    }
    .btn-back:hover { background: #1e3a2f; color: #fff; }
    .btn-secondary-link {
      font-size: 0.85rem;
      color: #414844;
      text-decoration: none;
      margin-left: 1rem;
    }
    .btn-secondary-link:hover { color: #2D4C3E; text-decoration: underline; }
  </style>
</head>
<body>
<div class="error-box">

  <!-- Código de estado -->
  <div class="error-code" th:text="${errorStatus}">500</div>

  <!-- Título -->
  <h1 class="error-title" th:text="${errorTitle}">Error inesperado</h1>

  <!-- Mensaje -->
  <p class="error-msg" th:text="${errorMessage}">Ha ocurrido un error. Por favor, inténtelo más tarde.</p>

  <!-- Ruta que falló -->
  <div th:if="${errorPath != null}" class="error-path" th:text="'Ruta: ' + ${errorPath}"></div>

  <!-- Acciones -->
  <div>
    <a href="javascript:history.back()" class="btn-back">← Volver</a>
    <a href="/catalog" class="btn-secondary-link">Ir al catálogo</a>
  </div>

  <!-- Branding -->
  <p style="margin-top:2.5rem; font-size:0.75rem; color:#727974;">
    <strong style="color:#2D4C3E;">BookSocial</strong> — El Curador Digital
  </p>
</div>
</body>
</html>
