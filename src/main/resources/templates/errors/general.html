<!--/*
  ============================================================
  Vista: Error genérico (GlobalExceptionHandler)
  Ruta: cualquier ruta que lance una excepción no controlada
  Controlador: GlobalExceptionHandler (@ControllerAdvice) — devuelve "errors/general"

  Recibe del modelo:
    - errorStatus  : int    — código HTTP (404, 500, 502, 503…)
    - errorTitle   : String — título corto del error ("No encontrado", "Error interno"…)
    - errorMessage : String — descripción del problema para el usuario
    - errorPath    : String — ruta de la petición que falló (opcional, puede ser null)

  Diferencia con error.html:
    - error.html usa las variables de Spring Boot: ${status}, ${error}, ${message}, ${path}
    - Esta vista usa nombres propios: ${errorStatus}, ${errorTitle}, ${errorMessage}, ${errorPath}

  Fragmentos incluidos: ninguno (standalone, sin navbar ni footer para no añadir ruido visual)
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${errorTitle} + ' — BookSocial'">Error — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos de error: compartidos con error.html (las clases son idénticas) -->
  <link rel="stylesheet" th:href="@{/css/pages/public/error.css}">
</head>
<!-- error-body: min-height:100vh + flex centering para la caja de error (error.css) -->
<body class="error-body">

<!-- error-box: tarjeta centrada con sombra suave (error.css) -->
<div class="error-box">

  <!-- Código de estado HTTP en tamaño grande -->
  <!-- error-code: 5rem, font-weight:800, color primary (error.css) -->
  <div class="error-code" th:text="${errorStatus}">500</div>

  <!-- Título amigable del error -->
  <!-- error-title: 1.4rem, negrita, color oscuro (error.css) -->
  <h1 class="error-title" th:text="${errorTitle}">Error inesperado</h1>

  <!-- Descripción legible para el usuario -->
  <!-- error-msg: 0.9rem, color muted, line-height 1.6 (error.css) -->
  <p class="error-msg" th:text="${errorMessage}">Ha ocurrido un error. Por favor, inténtelo más tarde.</p>

  <!-- Ruta de la petición que falló (solo si viene en el modelo) -->
  <!--
    th:if: Thymeleaf solo renderiza este elemento si errorPath no es null.
    error-path: fuente monospace + fondo gris claro (error.css).
  -->
  <div th:if="${errorPath != null}" class="error-path" th:text="'Ruta: ' + ${errorPath}"></div>

  <!-- Acciones para salir de la pantalla de error -->
  <!-- btn-back: botón verde principal (error.css) -->
  <!-- btn-secondary-link: enlace secundario sin fondo (error.css) -->
  <div>
    <a href="javascript:history.back()" class="btn-back">← Volver</a>
    <a href="/catalog" class="btn-secondary-link">Ir al catálogo</a>
  </div>

  <!-- Branding al pie -->
  <!-- error-branding: font-size pequeño, color muted; strong sobreescribe a color primary (error.css) -->
  <p class="error-branding">
    <strong>BookSocial</strong> — El Curador Digital
  </p>

</div>
</body>
</html>
