<!--/*
  ============================================================
  Vista: Gestión de editoriales — /admin/editorials
  Controlador: AdminEditorialsController (GET/POST)
  Acceso restringido: AdminInterceptor redirige a /auth/login si role != ADMIN.

  Recibe del modelo:
    - editorials : List<EditorialResponseDTO> — todas las editoriales.
                   Cada EditorialResponseDTO expone: id, name, country.
    - success    : String (opcional) — mensaje flash tras operación correcta.
    - error      : String (opcional) — mensaje flash tras error.

  Operaciones CRUD:
    - Crear : POST /admin/editorials/create      (form urlencoded, sin archivo)
    - Editar: POST /admin/editorials/{id}/update
    - Borrar: POST /admin/editorials/{id}/delete

  Es la vista más simple del panel admin: sin imágenes ni relaciones complejas.
  El formulario no usa enctype="multipart/form-data" porque no hay subida de archivos.

  CSS específico: /css/pages/admin/admin-shared.css
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editoriales — Admin BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos comunes a todas las vistas de administración -->
  <link rel="stylesheet" th:href="@{/css/pages/admin/admin-shared.css}">
</head>
<body class="admin-body">
<div class="admin-layout">

  <!-- Sidebar: argumento 'editorials' marca el enlace de Editoriales como activo -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar('editorials')}"></div>

  <main class="admin-main">

    <!-- Topbar: título + botón para abrir el modal de creación -->
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Editoriales</h1>
        <p class="admin-page-subtitle">Gestión de editoriales del catálogo</p>
      </div>
      <button class="btn btn-sm btn-primary d-flex align-items-center gap-1"
              data-bs-toggle="modal" data-bs-target="#createEditorialModal">
        <!-- admin-topbar-btn-icon: reduce el icono al tamaño del botón (admin-shared.css) -->
        <span class="material-symbols-outlined admin-topbar-btn-icon">add</span>
        Nueva Editorial
      </button>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mx-0 mb-3" role="alert">
      <span th:text="${success}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mx-0 mb-3" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de editoriales -->
    <div class="admin-card">
      <div class="admin-card-header">
        <p class="admin-card-title">
          Todas las editoriales
          <!--
            admin-table-count: badge de recuento junto al título (admin-shared.css).
            #lists.size(editorials): número total de editoriales en la lista.
          -->
          <span class="admin-table-count"
                th:text="'(' + ${#lists.size(editorials)} + ' total)'"></span>
        </p>
      </div>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>País</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- th:each: itera sobre todas las editoriales -->
            <tr th:each="editorial : ${editorials}">
              <!-- admin-table-id: columna de id en pequeño y atenuado (admin-shared.css) -->
              <td class="admin-table-id" th:text="${editorial.id}">—</td>
              <td>
                <!-- admin-table-name: nombre en negrita y color primary (admin-shared.css) -->
                <span class="admin-table-name" th:text="${editorial.name}">—</span>
              </td>
              <!-- admin-table-meta: texto secundario reducido (admin-shared.css) -->
              <td class="admin-table-meta"
                  th:text="${editorial.country != null} ? ${editorial.country} : '—'">—</td>
              <td>
                <div class="d-flex gap-1">
                  <!--
                    th:data-id / th:data-name / th:data-country:
                    Thymeleaf renderiza estos como atributos data-* estándar de HTML.
                    La función JS los lee para rellenar el formulario de edición.
                  -->
                  <button type="button" class="btn btn-sm btn-outline-secondary p-1"
                          title="Editar"
                          data-bs-toggle="modal" data-bs-target="#editEditorialModal"
                          th:data-id="${editorial.id}"
                          th:data-name="${editorial.name}"
                          th:data-country="${editorial.country}"
                          onclick="openEditEditorialModal(this)">
                    <!-- admin-table-action-icon: icono reducido en botones de acción (admin-shared.css) -->
                    <span class="material-symbols-outlined admin-table-action-icon">edit</span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger p-1"
                          title="Eliminar"
                          data-bs-toggle="modal" data-bs-target="#deleteEditorialModal"
                          th:data-id="${editorial.id}"
                          th:data-name="${editorial.name}"
                          onclick="openDeleteEditorialModal(this)">
                    <span class="material-symbols-outlined admin-table-action-icon">delete</span>
                  </button>
                </div>
              </td>
            </tr>
            <!-- Fila vacía si no hay editoriales -->
            <tr th:if="${editorials == null or editorials.isEmpty()}">
              <!-- admin-table-empty: mensaje de lista vacía (admin-shared.css) -->
              <td colspan="4" class="text-center py-4 admin-table-empty">
                No hay editoriales registradas
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- ============================================================
     MODALES BOOTSTRAP — fuera del .admin-layout
     ============================================================ -->

<!-- Modal: Crear Editorial -->
<!--
  Sin enctype="multipart/form-data": el formulario solo envía texto (name, country),
  por lo que el encoding por defecto (application/x-www-form-urlencoded) es suficiente.
-->
<div class="modal fade" id="createEditorialModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nueva Editorial</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form method="post" th:action="@{/admin/editorials/create}">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control form-control-sm" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">País</label>
              <input type="text" name="country" class="form-control form-control-sm"
                     placeholder="Ej: España">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-sm btn-primary">Crear Editorial</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Editar Editorial -->
<div class="modal fade" id="editEditorialModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Editorial</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="editEditorialForm" method="post">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
              <input type="text" id="editEditorialName" name="name" class="form-control form-control-sm" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">País</label>
              <input type="text" id="editEditorialCountry" name="country" class="form-control form-control-sm">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-sm btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Eliminar Editorial -->
<div class="modal fade" id="deleteEditorialModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Eliminar Editorial</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- admin-modal-confirm: tamaño del párrafo de confirmación (admin-shared.css) -->
        <p class="admin-modal-confirm">¿Seguro que quieres eliminar la editorial
          <strong id="deleteEditorialName"></strong>?
          Esta acción no se puede deshacer.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <form id="deleteEditorialForm" method="post" class="d-inline">
          <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openEditEditorialModal(btn) {
    document.getElementById('editEditorialForm').action = '/admin/editorials/' + btn.dataset.id + '/update';
    document.getElementById('editEditorialName').value = btn.dataset.name || '';
    document.getElementById('editEditorialCountry').value = btn.dataset.country || '';
  }

  function openDeleteEditorialModal(btn) {
    document.getElementById('deleteEditorialForm').action = '/admin/editorials/' + btn.dataset.id + '/delete';
    document.getElementById('deleteEditorialName').textContent = '"' + btn.dataset.name + '"';
  }
</script>
</body>
</html>
