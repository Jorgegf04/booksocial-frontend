<!--/*
  ============================================================
  Vista: Gestión de pedidos — /admin/orders
  Controlador: AdminOrdersController (GET/POST)
  Acceso restringido: AdminInterceptor redirige a /auth/login si role != ADMIN.

  Recibe del modelo:
    - orders  : List<OrderResponseDTO> — todos los pedidos del sistema.
                Cada OrderResponseDTO expone: id, username, date, totalItems,
                total, orderLines (List<OrderLineResponseDTO> con title, quantity…).
    - success : String (opcional) — mensaje flash tras actualizar el estado.
    - error   : String (opcional) — mensaje flash tras error.

  Flujo de tracking de pedidos:
    El administrador puede actualizar el estado de cada pedido mediante
    un modal. Al guardar, el backend envía un email de notificación al usuario.
    Estados disponibles: PREPARING → SHIPPED → IN_TRANSIT → DELIVERED | CANCELED.

  Columna "Líneas": muestra un preview comprimido de los primeros 2 títulos
  de las líneas del pedido. Si hay más de 2, añade "+N más".
    - lineStat.index: posición 0-based en la iteración.
    - lineStat.last: true cuando es el último elemento.

  CSS específico: /css/pages/admin/admin-shared.css
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos — Admin BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos comunes a todas las vistas de administración -->
  <link rel="stylesheet" th:href="@{/css/pages/admin/admin-shared.css}">
</head>
<body class="admin-body">
<div class="admin-layout">

  <!-- Sidebar: argumento 'orders' marca el enlace de Pedidos como activo -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar('orders')}"></div>

  <main class="admin-main">

    <!-- Topbar: sin botón de creación (los pedidos los generan los usuarios) -->
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Pedidos</h1>
        <p class="admin-page-subtitle">Historial completo de pedidos</p>
      </div>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mx-0 mb-3" role="alert">
      <span th:text="${success}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mx-0 mb-3" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de pedidos -->
    <div class="admin-card">
      <div class="admin-card-header">
        <p class="admin-card-title">Todos los pedidos
          <!--
            admin-table-count: badge de recuento junto al título (admin-shared.css).
            #lists.size(orders): número total de pedidos en la lista.
          -->
          <span class="admin-table-count"
                th:text="'(' + ${#lists.size(orders)} + ' total)'"></span>
        </p>
      </div>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Usuario</th>
              <th>Fecha</th>
              <th>Artículos</th>
              <th>Total</th>
              <th>Líneas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- th:each: itera sobre todos los pedidos -->
            <tr th:each="order : ${orders}">
              <!-- admin-order-id: número de pedido en negrita y color primary (admin-shared.css) -->
              <td class="admin-order-id" th:text="'#' + ${order.id}">#1</td>
              <!-- admin-table-meta: tamaño reducido para celdas secundarias (admin-shared.css) -->
              <td class="admin-table-meta" th:text="${order.username != null} ? ${order.username} : '—'">—</td>
              <td class="admin-table-meta"
                  th:text="${order.date != null} ? ${#temporals.format(order.date, 'dd/MM/yyyy HH:mm')} : '—'">—</td>
              <td class="admin-table-meta" th:text="${order.totalItems != null} ? ${order.totalItems} : '—'">—</td>
              <!-- admin-inv-price: precio en verde y negrita (admin-shared.css) -->
              <td class="admin-inv-price"
                  th:text="'€' + ${#numbers.formatDecimal(order.total != null ? order.total : 0, 1, 2)}">€0.00</td>
              <td>
                <!--
                  admin-order-lines: preview comprimido de líneas (admin-shared.css).
                  th:if / lineStat: el objeto de estado permite usar lineStat.index y lineStat.last
                  para limitar a 2 títulos y añadir coma entre ellos.
                -->
                <div th:if="${order.orderLines != null and !order.orderLines.isEmpty()}"
                     class="admin-order-lines">
                  <span th:each="line, lineStat : ${order.orderLines}"
                        th:if="${lineStat.index < 2}">
                    <span th:text="${line.title != null} ? ${line.title} : '—'">—</span>
                    <span th:if="!${lineStat.last} and ${lineStat.index < 1}">, </span>
                  </span>
                  <span th:if="${#lists.size(order.orderLines) > 2}"
                        th:text="' +' + (${#lists.size(order.orderLines)} - 2) + ' más'">
                  </span>
                </div>
              </td>
              <td>
                <button type="button" class="btn btn-sm btn-outline-secondary p-1"
                        title="Actualizar estado"
                        data-bs-toggle="modal" data-bs-target="#trackingModal"
                        th:data-orderid="${order.id}"
                        th:data-username="${order.username}"
                        onclick="openTrackingModal(this)">
                  <!-- admin-table-action-icon: icono reducido (admin-shared.css) -->
                  <span class="material-symbols-outlined admin-table-action-icon">local_shipping</span>
                </button>
              </td>
            </tr>
            <!-- Fila vacía si no hay pedidos -->
            <tr th:if="${orders == null or orders.isEmpty()}">
              <!-- admin-table-empty: mensaje de lista vacía (admin-shared.css) -->
              <td colspan="7" class="text-center py-4 admin-table-empty">
                No hay pedidos registrados
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- ============================================================
     MODAL DE TRACKING — fuera del .admin-layout
     ============================================================ -->

<!-- Modal: Actualizar estado del pedido -->
<div class="modal fade" id="trackingModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Actualizar estado del pedido</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="trackingForm" method="post">
        <div class="modal-body">
          <!--
            admin-tracking-order: tamaño del párrafo principal (admin-shared.css).
            mb-3: Bootstrap — margen inferior de 1rem (equivale a los 16px originales).
            admin-tracking-username: resalta el nombre en color primary (admin-shared.css).
          -->
          <p class="admin-tracking-order mb-3">
            Pedido <strong id="trackingOrderId"></strong>
            — Usuario: <span id="trackingUsername" class="admin-tracking-username"></span>
          </p>
          <!--
            admin-tracking-note: nota informativa en gris (admin-shared.css).
            Se informa al admin de que el cambio de estado enviará un email al usuario.
          -->
          <p class="admin-tracking-note mb-3">
            Al guardar se enviará un email de notificación al usuario.
          </p>
          <label class="form-label fw-semibold">Nuevo estado <span class="text-danger">*</span></label>
          <select name="status" class="form-select form-select-sm" required>
            <option value="">— Seleccionar estado —</option>
            <option value="PREPARING">En preparación</option>
            <option value="SHIPPED">Enviado</option>
            <option value="IN_TRANSIT">En tránsito</option>
            <option value="DELIVERED">Entregado</option>
            <option value="CANCELED">Cancelado</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-sm btn-primary">Guardar y notificar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openTrackingModal(btn) {
    const orderId = btn.dataset.orderid;
    document.getElementById('trackingForm').action = '/admin/orders/' + orderId + '/tracking';
    document.getElementById('trackingOrderId').textContent = '#' + orderId;
    document.getElementById('trackingUsername').textContent = btn.dataset.username || '—';
  }
</script>
</body>
</html>
