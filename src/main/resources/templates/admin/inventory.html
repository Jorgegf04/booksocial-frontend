<!--/*
  ============================================================
  Vista: Gestión de inventario — /admin/inventory
  Controlador: AdminInventoryController (GET)
  Acceso restringido: AdminInterceptor redirige a /auth/login si role != ADMIN.

  Recibe del modelo:
    - products : List<ProductResponseDTO> — todos los productos con precio y stock.
                 Cada ProductResponseDTO expone: workTitle, editionTitle, editionIsbn,
                 editorialName, price, stock.
    - editions : List<EditionResponseDTO> — reservado para futuros formularios de creación.

  Esta vista es solo de lectura: muestra el estado actual del inventario.
  No tiene modales de creación/edición porque la gestión de stock se hace
  al crear ediciones y productos desde sus secciones específicas.

  Indicadores de stock (admin-stock-badge, main.css):
    th:classappend con expresión ternaria anidada:
      ${p.stock == 0}       → 'admin-stock-empty' (rojo)
      ${p.stock <= 5}       → 'admin-stock-low'   (ámbar)
      else                  → 'admin-stock-ok'    (verde)
    Thymeleaf evalúa la condición de izquierda a derecha como un if-elseif-else.

  CSS específico: /css/pages/admin/admin-shared.css
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario — Admin BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos comunes a todas las vistas de administración -->
  <link rel="stylesheet" th:href="@{/css/pages/admin/admin-shared.css}">
</head>
<body class="admin-body">
<div class="admin-layout">

  <!-- Sidebar: argumento 'inventory' marca el enlace de Inventario como activo -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar('inventory')}"></div>

  <main class="admin-main">

    <!-- Topbar: solo título, sin botón de creación (vista de solo lectura) -->
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Inventario</h1>
        <p class="admin-page-subtitle">Productos disponibles y estado de stock</p>
      </div>
    </div>

    <!-- Mensajes flash -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mx-0 mb-3" role="alert">
      <span th:text="${success}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mx-0 mb-3" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de productos -->
    <div class="admin-card">
      <div class="admin-card-header">
        <p class="admin-card-title">Productos disponibles
          <!--
            admin-table-count: badge de recuento junto al título (admin-shared.css).
            #lists.size(lista): número de elementos en la lista del modelo.
          -->
          <span class="admin-table-count"
                th:text="'(' + ${#lists.size(products)} + ' total)'"></span>
        </p>
      </div>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Obra</th>
              <th>Editorial</th>
              <th>ISBN</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- th:each: itera sobre todos los productos del inventario -->
            <tr th:each="p : ${products}">
              <td>
                <!-- admin-table-name: nombre de la obra en negrita y color primary (admin-shared.css) -->
                <div class="admin-table-name" th:text="${p.workTitle}">—</div>
                <!--
                  admin-inv-edition: subtítulo de edición en gris suave (admin-shared.css).
                  th:text con condición: muestra el título de edición solo si existe.
                -->
                <div class="admin-inv-edition"
                     th:text="${p.editionTitle != null} ? ${p.editionTitle} : ''">
                </div>
              </td>
              <!-- admin-table-meta: texto secundario de tamaño reducido (admin-shared.css) -->
              <td class="admin-table-meta" th:text="${p.editorialName}">—</td>
              <!--
                admin-inv-isbn: ISBN en fuente monospace para facilitar la lectura
                de códigos alfanuméricos (admin-shared.css).
              -->
              <td class="admin-inv-isbn"
                  th:text="${p.editionIsbn != null} ? ${p.editionIsbn} : '—'">—</td>
              <!-- admin-inv-price: precio en verde y negrita (admin-shared.css) -->
              <td class="admin-inv-price"
                  th:text="'€' + ${#numbers.formatDecimal(p.price != null ? p.price : 0, 1, 2)}">€0.00</td>
              <td>
                <!--
                  admin-stock-badge: pastilla de unidades (main.css).
                  th:classappend con ternaria anidada: evalúa stock=0 primero,
                  luego stock<=5, y si ninguna se cumple usa 'admin-stock-ok'.
                -->
                <span class="admin-stock-badge"
                      th:classappend="${p.stock == 0} ? 'admin-stock-empty' : (${p.stock <= 5} ? 'admin-stock-low' : 'admin-stock-ok')"
                      th:text="${p.stock} + ' uds.'">0</span>
              </td>
              <td>
                <button type="button" class="btn btn-sm btn-outline-secondary p-1"
                        title="Ajustar stock"
                        data-bs-toggle="modal" data-bs-target="#stockModal"
                        th:data-editionid="${p.editionId}"
                        th:data-worktitle="${p.workTitle}"
                        th:data-isbn="${p.editionIsbn}"
                        th:data-stock="${p.stock}"
                        onclick="openStockModal(this)">
                  <span class="material-symbols-outlined admin-table-action-icon">inventory</span>
                </button>
              </td>
            </tr>
            <!-- Fila vacía si no hay productos -->
            <tr th:if="${products == null or products.isEmpty()}">
              <!-- admin-table-empty: mensaje de lista vacía (admin-shared.css) -->
              <td colspan="6" class="text-center py-4 admin-table-empty">
                No hay productos disponibles
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- ============================================================
     MODAL DE AJUSTE DE STOCK — fuera del .admin-layout
     ============================================================ -->

<!-- Modal: Ajustar stock -->
<div class="modal fade" id="stockModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Ajustar stock</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="stockForm" method="post">
        <div class="modal-body">
          <p class="admin-tracking-order mb-1">
            <strong id="stockWorkTitle"></strong>
          </p>
          <p class="admin-tracking-note mb-3">
            ISBN: <span id="stockIsbn"></span>
          </p>
          <label class="form-label fw-semibold">Nuevo stock <span class="text-danger">*</span></label>
          <input type="number" id="stockInput" name="newStock" class="form-control form-control-sm"
                 min="0" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openStockModal(btn) {
    document.getElementById('stockForm').action = '/admin/inventory/' + btn.dataset.editionid + '/stock';
    document.getElementById('stockWorkTitle').textContent = btn.dataset.worktitle || '—';
    document.getElementById('stockIsbn').textContent = btn.dataset.isbn || '—';
    document.getElementById('stockInput').value = btn.dataset.stock || 0;
  }
</script>
</body>
</html>
