<!--/*
  ============================================================
  Vista: Comunidad — directorio de usuarios
  Ruta: /community
  Controlador: CommunityController#index() (GET)

  Recibe del modelo:
    - users         : List<UserResponseDTO> — usuarios a mostrar (excluye al propio).
    - followingIds  : Set<Long>             — IDs de usuarios que ya sigue la sesión activa.
    - sessionUserId : Long                  — ID del usuario en sesión (null si no hay sesión).

  Funcionalidades:
    · Botón "Seguir"      → POST /community/{id}/follow   (solo si hay sesión y no sigue).
    · Botón "Siguiendo ✓" → POST /community/{id}/unfollow (si ya sigue).
    · Sin sesión → botón "Ver perfil" en lugar de los botones de seguir.
    · Buscador client-side: filtra tarjetas por username en tiempo real (JS, sin recarga).
    · Avatar o nombre → navega al perfil público del usuario (/user/{id}).

  Fragmentos incluidos:
    - fragments/navbar    :: navbar
    - fragments/messages  :: messages
    - fragments/footer    :: footer
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comunidad — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos del directorio de usuarios -->
  <link rel="stylesheet" th:href="@{/css/pages/public/community.css}">
</head>
<body>

  <!-- NAVBAR -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <!-- community-main: padding-top compensa la navbar fixed (community.css) -->
  <main class="container community-main">

    <!-- Mensajes flash de seguir / dejar de seguir -->
    <div th:replace="~{fragments/messages :: messages}"></div>

    <!-- Cabecera: título + buscador -->
    <div class="d-flex align-items-end justify-content-between mb-4 flex-wrap gap-3">
      <div>
        <p class="filter-section-title mb-1">Lectores</p>
        <!-- community-heading: font-serif + color primary (community.css) -->
        <h1 class="font-serif mb-0 community-heading">Comunidad</h1>
      </div>

      <!--
        Buscador client-side: filtra las tarjetas en tiempo real con JS sin recargar.
        community-search-group: limita el ancho máximo del input-group (community.css).
      -->
      <div class="input-group community-search-group">
        <!--
          id="searchInput": el JS escucha el evento 'input' en este elemento.
          community-search-input: border-radius redondeado en el lado izquierdo (community.css).
        -->
        <input id="searchInput" type="text"
               class="form-control form-control-sm community-search-input"
               placeholder="Buscar usuario...">
        <!--
          input-group-text: Bootstrap — sufijo visual del input-group.
          community-search-btn: fondo primary + border-radius derecho (community.css).
        -->
        <span class="input-group-text community-search-btn">
          <span class="material-symbols-outlined community-search-icon">search</span>
        </span>
      </div>
    </div>

    <!-- Estado vacío: ningún usuario en el sistema -->
    <div th:if="${users == null or users.isEmpty()}"
         class="text-center py-5 community-empty">
      <span class="material-symbols-outlined d-block mb-2 community-empty-icon">group</span>
      <p class="font-serif mb-1 community-empty-text">
        Aún no hay otros lectores
      </p>
    </div>

    <!-- Grid de usuarios -->
    <!--
      id="userGrid": el JS oculta columnas individuales según la búsqueda.
      th:if: Thymeleaf renderiza el grid solo si hay usuarios.
    -->
    <div id="userGrid" class="row g-3"
         th:if="${users != null and !users.isEmpty()}">

      <!--
        th:each="u : ${users}": itera sobre la lista de usuarios.
        user-card-col: clase usada por el JS para seleccionar columnas a ocultar.
        th:attr="data-username=...": el JS filtra comparando este data-* con el input.
      -->
      <div th:each="u : ${users}"
           class="col-sm-6 col-md-4 col-lg-3 user-card-col"
           th:attr="data-username=${u.username}">

        <!--
          community-user-card: border-radius + border + bg gris claro (community.css).
          card h-100: Bootstrap — tarjeta de altura completa para alinear el contenido.
          text-center: Bootstrap — centra todo el contenido de la tarjeta.
        -->
        <div class="card h-100 text-center community-user-card">

          <div class="card-body d-flex flex-column align-items-center pt-4 pb-3 gap-2">

            <!-- Avatar: imagen o placeholder con inicial del username -->
            <a th:href="@{'/user/' + ${u.id}}" class="text-decoration-none">
              <!--
                community-user-avatar: imagen redonda 4rem × 4rem (community.css).
              -->
              <img th:if="${u.img != null and !u.img.isEmpty()}"
                   th:src="${u.img}" th:alt="${u.username}"
                   class="community-user-avatar">
              <!--
                profile-avatar-placeholder: clase de main.css para el círculo con inicial.
                community-avatar-placeholder: modifica el tamaño a 4rem (community.css).
                #strings.substring(str,0,1).toUpperCase(): extrae la primera letra en mayúscula.
              -->
              <div th:unless="${u.img != null and !u.img.isEmpty()}"
                   class="profile-avatar-placeholder community-avatar-placeholder"
                   th:text="${u.username != null ? #strings.substring(u.username,0,1).toUpperCase() : '?'}">
              </div>
            </a>

            <!-- Nombre de usuario enlazado al perfil -->
            <!-- community-user-name: negrita + color primary (community.css) -->
            <a th:href="@{'/user/' + ${u.id}}"
               class="text-decoration-none community-user-name"
               th:text="${u.username}">username</a>

            <!-- Nombre completo (nombre + apellido, ambos opcionales) -->
            <!-- community-user-fullname: font-size pequeño + color muted (community.css) -->
            <p class="mb-0 community-user-fullname"
               th:text="${(u.name != null ? u.name : '') + (u.secondName != null ? ' ' + u.secondName : '')}"></p>

            <!--
              profile-badge: pastilla de rol (main.css).
              th:classappend: añade 'admin' o 'subscribed' al badge según el rol.
              Resultado: class="profile-badge admin" o class="profile-badge subscribed"
            -->
            <span class="profile-badge"
                  th:classappend="${u.role == 'ADMIN'} ? 'admin' : (${u.role == 'SUBSCRIBED'} ? 'subscribed' : '')"
                  th:text="${u.role != null ? u.role : 'USER'}">USER</span>

            <!-- Botones de seguir / dejar de seguir (solo si hay sesión) -->
            <div class="mt-auto pt-2 w-100"
                 th:if="${sessionUserId != null}">

              <!--
                th:if: muestra "Seguir" si followingIds no contiene el ID del usuario.
                community-follow-btn: padding y font-size reducidos (community.css).
                w-100: Bootstrap — botón de ancho completo.
              -->
              <form th:if="${followingIds == null or !followingIds.contains(u.id)}"
                    th:action="@{'/community/' + ${u.id} + '/follow'}"
                    method="post">
                <button type="submit"
                        class="btn-primary-pill w-100 community-follow-btn">
                  Seguir
                </button>
              </form>

              <!--
                community-unfollow-btn: ghost pill compacto (community.css).
              -->
              <form th:if="${followingIds != null and followingIds.contains(u.id)}"
                    th:action="@{'/community/' + ${u.id} + '/unfollow'}"
                    method="post">
                <button type="submit"
                        class="w-100 community-unfollow-btn">
                  Siguiendo ✓
                </button>
              </form>

            </div>

            <!-- Sin sesión: solo enlace al perfil público del usuario -->
            <div class="mt-auto pt-2 w-100" th:if="${sessionUserId == null}">
              <!--
                community-view-profile-btn: mismo tamaño que los botones de follow (community.css).
              -->
              <a th:href="@{'/user/' + ${u.id}}"
                 class="btn-primary-pill d-block text-center text-decoration-none community-view-profile-btn">
                Ver perfil
              </a>
            </div>

          </div>
        </div>
      </div>

    </div>

    <!-- Estado vacío de búsqueda (oculto por defecto, JS lo muestra si no hay coincidencias) -->
    <div id="emptySearch" class="text-center py-5" style="display:none;">
      <span class="material-symbols-outlined d-block mb-2 community-search-empty-icon">search_off</span>
      <p class="community-search-empty-text">Ningún usuario coincide con la búsqueda.</p>
    </div>

  </main>

  <!-- FOOTER -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!--
    Buscador client-side: filtra tarjetas por data-username en tiempo real.
    No hace petición al servidor — todo el filtrado es en el navegador.
    IIFE (Immediately Invoked Function Expression): encapsula las variables para
    no contaminar el scope global.
  -->
  <script>
  (function () {
    const input = document.getElementById('searchInput');
    const cols  = document.querySelectorAll('.user-card-col');
    const empty = document.getElementById('emptySearch');

    if (!input) return;

    input.addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      let visible = 0;
      cols.forEach(col => {
        const name = (col.dataset.username || '').toLowerCase();
        const show = !q || name.includes(q);
        col.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      if (empty) empty.style.display = (q && visible === 0) ? '' : 'none';
    });
  })();
  </script>

</body>
</html>
