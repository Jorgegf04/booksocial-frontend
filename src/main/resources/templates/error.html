<!--/*
  ============================================================
  Vista: Página de error de Spring Boot (Whitelabel override)
  Ruta: /error (manejada automáticamente por Spring Boot)
  Controlador: BasicErrorController de Spring Boot (interno)

  Recibe del modelo (inyectado automáticamente por Spring Boot):
    - status    : Integer → código HTTP (404, 403, 500, 503...)
    - error     : String  → descripción técnica del error
    - message   : String  → mensaje de detalle (puede ser null)
    - path      : String  → ruta de la petición que falló
    - timestamp : Date    → momento del error

  Fragmentos que incluye: ninguno
  (página standalone sin navbar ni footer para evitar errores en cascada)
  ============================================================
*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- th:text en el title: concatena el código de estado con el nombre del sitio -->
  <title th:text="'Error ' + ${status} + ' — BookSocial'">Error — BookSocial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos globales: fuentes, variables de color -->
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <!-- Estilos específicos de esta página de error -->
  <link rel="stylesheet" th:href="@{/css/pages/public/error.css}">
</head>
<!--
  error-body: centra verticalmente la caja de error con flexbox (error.css).
  Los estilos de fondo y fuente ya vienen de main.css (body rule).
-->
<body class="error-body">

<!-- Caja contenedora centrada con sombra suave -->
<div class="error-box">

  <!-- Código de estado HTTP en tamaño grande (404, 500...) -->
  <!-- th:text: reemplaza el "500" por defecto con el código real del servidor -->
  <div class="error-code" th:text="${status}">500</div>

  <!-- Título amigable según el código: ternario anidado de Thymeleaf -->
  <!--
    Thymeleaf permite expresiones ternarias encadenadas: condición ? valor : otro.
    Aquí selecciona un texto legible según el valor del status del modelo.
  -->
  <h1 class="error-title"
      th:text="${status == 404} ? 'Página no encontrada'
             : (status == 403 ? 'Acceso denegado'
             : (status == 503 or status == 502 ? 'Servicio no disponible'
             : 'Error inesperado'))">Error</h1>

  <!-- Descripción del error en lenguaje accesible para el usuario -->
  <p class="error-msg"
     th:text="${status == 404} ? 'El recurso que buscas no existe o ha sido eliminado.'
            : (status == 403 ? 'No tienes permisos para acceder a esta página.'
            : (status == 503 or status == 502 ? 'No se puede conectar con el servidor. Inténtalo más tarde.'
            : 'Ha ocurrido un error inesperado. Por favor, inténtelo más tarde.'))">
    Ha ocurrido un error.
  </p>

  <!-- Ruta de la petición fallida: solo se muestra si Spring Boot la inyecta -->
  <!-- th:if: este div no aparece si path es null -->
  <div th:if="${path != null}" class="error-path" th:text="'Ruta: ' + ${path}"></div>

  <!-- Botones de acción -->
  <div>
    <!-- btn-back: botón verde oscuro para volver a la página anterior -->
    <a href="javascript:history.back()" class="btn-back">← Volver</a>
    <!-- btn-secondary-link: enlace de texto para ir al catálogo -->
    <a href="/catalog" class="btn-secondary-link">Ir al catálogo</a>
  </div>

  <!-- Branding al pie: error-branding y su strong definidos en error.css -->
  <p class="error-branding">
    <strong>BookSocial</strong> — El Curador Digital
  </p>
</div>
</body>
</html>
