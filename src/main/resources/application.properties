
spring.application.name=booksocial-frontend

server.port=8000

api.base-url=http://localhost:9999/api

spring.thymeleaf.cache=false

# ===============================
# MAIL (Gmail SMTP)
# Pasos: Gmail → Cuenta → Seguridad → Contraseñas de aplicación (requiere 2FA).
# Establece MAIL_USERNAME y MAIL_PASSWORD como variables de entorno,
# o sustitúyelas directamente aquí en desarrollo.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
